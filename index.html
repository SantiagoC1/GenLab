<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GenLab Prototipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
/* Concepto: aplicación de laboratorio, barra lateral por rol, área de trabajo clara, estados como fichas de color */
:root{
  --bg:#EEF2F4; --surface:#FFFFFF; --surface2:#F6F8F9; --ink:#14232E; --muted:#5B6B77; --line:#D8E0E5;
  --accent:#0B6E7A; --accent-ink:#FFFFFF; --accent-soft:#DDF0F2;
  --good:#1F7A4D; --good-soft:#DDF3E7; --warn:#8A5A00; --warn-soft:#FBEBC8; --bad:#B3321F; --bad-soft:#FBE0DB; --info:#2A5DA8; --info-soft:#DEE9F8;
  --urgent:#B3321F;
  --f-body:'IBM Plex Sans',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,monospace; --f-disp:'Fraunces',Georgia,serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E171C; --surface:#162229; --surface2:#1B2A32; --ink:#E6EEF2; --muted:#94A6B1; --line:#2A3B45;
  --accent:#4FB7C3; --accent-ink:#06242A; --accent-soft:#16363C;
  --good:#5BC58C; --good-soft:#163A29; --warn:#E4B04F; --warn-soft:#3B2D0F; --bad:#F0806E; --bad-soft:#40201B; --info:#7FA9E8; --info-soft:#1B2D49; --urgent:#F0806E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E171C; --surface:#162229; --surface2:#1B2A32; --ink:#E6EEF2; --muted:#94A6B1; --line:#2A3B45;
  --accent:#4FB7C3; --accent-ink:#06242A; --accent-soft:#16363C;
  --good:#5BC58C; --good-soft:#163A29; --warn:#E4B04F; --warn-soft:#3B2D0F; --bad:#F0806E; --bad-soft:#40201B; --info:#7FA9E8; --info-soft:#1B2D49; --urgent:#F0806E; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:grid;grid-template-columns:230px minmax(0,1fr);grid-template-rows:auto 1fr;height:100%}
header.top{grid-column:1/3;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-disp);font-size:20px;font-weight:600;color:var(--accent);letter-spacing:.2px;margin-right:8px}
.brand small{font-family:var(--f-body);font-size:11px;color:var(--muted);font-weight:400;margin-left:6px;letter-spacing:0}
.sel{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
select,input[type=text],input[type=password],input[type=email],input[type=number],input[type=date],textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0;max-width:100%}
select:focus,input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
header .sp{flex:1}
.tools{display:flex;gap:8px;flex-wrap:wrap}
nav.side{background:var(--surface);border-right:1px solid var(--line);padding:12px 8px;overflow:auto}
nav.side .who{padding:6px 10px 12px;border-bottom:1px solid var(--line);margin-bottom:8px}
nav.side .who b{display:block;font-size:13px}
nav.side .who span{font-size:12px;color:var(--muted)}
nav.side button{display:flex;width:100%;justify-content:space-between;align-items:center;text-align:left;background:none;border:0;border-radius:6px;padding:8px 10px;cursor:pointer;color:var(--ink)}
nav.side button:hover{background:var(--surface2)}
nav.side button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.badge{background:var(--bad);color:#fff;border-radius:10px;font-size:11px;padding:0 6px;min-width:18px;text-align:center}
main{overflow:auto;padding:20px 24px 60px;min-width:0}
.pg-h{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.pg-h h1{font-family:var(--f-body);font-size:24px;letter-spacing:-.01em;margin:0;font-weight:600;text-wrap:balance}
.pg-h p{margin:2px 0 0;color:var(--muted);max-width:70ch}
.scn{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted);border:1px dashed var(--line);border-radius:4px;padding:2px 7px;white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.card>h2{font-size:15px;margin:0 0 10px;font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;min-width:0}
.field label{font-size:12px;color:var(--muted);font-weight:500}
.field.full{grid-column:1/-1}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:var(--surface);color:var(--accent);border:1px solid var(--accent)}
.btn.ghost{background:none;color:var(--muted);border:1px solid var(--line)}
.btn.bad{background:var(--bad);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn.sm{padding:4px 9px;font-size:12px}
table{border-collapse:collapse;width:100%}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface2)}
.tw{overflow-x:auto}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:500;background:var(--surface2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tag{display:inline-flex;gap:4px;align-items:center;background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:2px 4px 2px 8px;font-size:12px;margin:0 4px 4px 0}
.tag button{background:none;border:0;cursor:pointer;color:inherit;padding:0 4px;font-size:14px}
.mono{font-family:var(--f-mono);font-size:12.5px}
.muted{color:var(--muted)}
.note{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:8px 10px;font-size:12.5px;margin:8px 0}
.note.ok{background:var(--good-soft);color:var(--good)}
.note.err{background:var(--bad-soft);color:var(--bad)}
.note.inf{background:var(--info-soft);color:var(--info)}
.sugg{position:relative}
.sugg ul{position:absolute;z-index:5;left:0;right:0;top:100%;margin:2px 0 0;padding:4px;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.15);max-height:200px;overflow:auto}
.sugg li{padding:6px 8px;border-radius:4px;cursor:pointer}
.sugg li:hover{background:var(--accent-soft)}
.steps{display:flex;gap:0;overflow-x:auto;padding:4px 0 10px;margin:0;list-style:none}
.st{flex:1 0 82px;text-align:center;font-size:11px;color:var(--muted);position:relative;padding-top:20px}
.st::before{content:"";position:absolute;top:6px;left:50%;width:12px;height:12px;border-radius:50%;background:var(--line);transform:translateX(-50%);z-index:1}
.st::after{content:"";position:absolute;top:11px;left:-50%;width:100%;height:2px;background:var(--line)}
.st:first-child::after{display:none}
.st.done{color:var(--ink)} .st.done::before,.st.done::after{background:var(--accent)}
.st.now{color:var(--accent);font-weight:600} .st.now::before{background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.st.bad{color:var(--bad);font-weight:600} .st.bad::before{background:var(--bad);box-shadow:0 0 0 4px var(--bad-soft)} .st.bad::after{background:var(--accent)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 12px}
.kv dt{color:var(--muted);font-size:12.5px} .kv dd{margin:0}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.slot{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 0;cursor:pointer;text-align:center;font-family:var(--f-mono);font-size:12px}
.slot.taken{opacity:.35;cursor:not-allowed;text-decoration:line-through}
.slot.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.map{width:100%;height:auto;background:var(--surface2);border:1px solid var(--line);border-radius:8px}
.chat{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow:auto;padding:4px}
.msg{max-width:78%;padding:8px 12px;border-radius:12px}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.msg.b{align-self:flex-start;background:var(--surface2);border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:50;max-width:90vw}
.drawer{position:fixed;right:0;top:0;bottom:0;width:340px;max-width:100%;background:var(--surface);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.15);z-index:40;padding:16px;overflow:auto}
.drawer h3{margin:14px 0 6px;font-size:13px}
.login{max-width:400px;margin:20px auto}
.urgent{color:var(--urgent);font-weight:600}
.qr{width:72px;height:72px;image-rendering:pixelated}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}
@media (max-width:820px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto 1fr}
  .tools{flex-wrap:nowrap;overflow-x:auto;width:100%;padding-bottom:2px}
  .tools .btn{white-space:nowrap;flex:0 0 auto}
  header.top{grid-column:1}
  nav.side{display:flex;gap:4px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px}
  nav.side .who{display:none}
  nav.side button{width:auto;white-space:nowrap}
  main{padding:14px 16px 60px}
  body.dr #app{margin-right:0}
  .grid2,.grid3{grid-template-columns:minmax(0,1fr)}
  .kv{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){.toast{animation:in .2s ease}@keyframes in{from{opacity:0;transform:translate(-50%,8px)}}
  /* único momento animado: el estudio avanza de etapa en la línea de tiempo */
  .st.adv::after{transform-origin:left center;animation:fill .55s ease-out}
  .st.adv::before{animation:pop .7s .35s ease-out both}
  @keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes pop{0%{transform:translateX(-50%) scale(.5)}55%{transform:translateX(-50%) scale(1.45)}100%{transform:translateX(-50%) scale(1)}}}
.skip{position:absolute;left:-999px;top:8px}
.skip:focus{left:8px;z-index:60;background:var(--accent);color:var(--accent-ink);padding:6px 12px;border-radius:6px}
tr.click:focus-visible td{background:var(--accent-soft)}
tr.click:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
body.dr #app{margin-right:360px}
body.big #app{zoom:1.18}
.drawer ol{margin:6px 0 0;padding:0;list-style:none}
.drawer ol li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.drawer ol li .n{flex:0 0 22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:600;display:grid;place-items:center}
.drawer ul.plain{margin:6px 0 0;padding-left:18px}
.drawer ul.plain li{margin-bottom:6px}
.hist{margin:0;padding:0;list-style:none}
.hist li{padding:6px 0;border-bottom:1px solid var(--line)}
</style>
</head>

<script>

 registrar(){const f=ctx.f;if(!f.rnom||!f.rape||!f.rmail||!f.rpw){toast('Completá los campos obligatorios');return}const ex=S.users.find(u=>u.m===f.rmail);if(ex){toast('Ese mail ya está registrado');return}S.users.push({n:f.rnom+' '+f.rape,r:f.rrol||'medico',m:f.rmail,prov:''});toast('Registro creado. Ya podés ingresar con tus credenciales de acceso');role='visit';view='login';render()},

 altaUsuario(){const f=ctx.f,r=f.urol||'medico';if(!f.unom||!f.umail){toast('Completá nombre y mail');return}if(S.users.some(u=>u.m===f.umail)){toast('Ese mail ya existe');return}if(r==='trans'){const pv=f.uprov||'Buenos Aires';if(S.users.some(u=>u.r==='trans'&&u.prov===pv)){toast('Ya existe un transportista para '+pv);return}S.users.push({n:f.unom,r,m:f.umail,prov:pv})}else S.users.push({n:f.unom,r,m:f.umail,prov:''});toast('Usuario creado. Credenciales enviadas por mail');f.unom='';f.umail='';render()},

 asigPac(){if(!ctx.f.cup||!ctx.f.cpac){toast('Elegí un cupón y un paciente');return}const c=S.cups.find(x=>x.code===ctx.f.cup);c.medico='asignado:'+ctx.f.cpac;c.paciente=ctx.f.cpac;aviso('p:'+ctx.f.cpac,'Tu médico te asignó el cupón de descuento '+c.code+' ('+c.pct+'%).');toast('Cupón asignado al paciente');ctx.f.cup='';render()},

 pagar(){const s=Object.values(S.st).find(x=>x.pid===S.me);const pct=ctx.cupOk?ctx.cupOk.pct:0;if(ctx.cupOk){ctx.cupOk.estado='Usado';s.cupon=ctx.cupOk.code}s.cob={modo:'part'};s.pagado=true;s.pres.pagado=s.pres.monto*(1-pct/100);aviso('p:'+s.pid,'Pago confirmado. Ya podés sacar turno.',s.id);if(s.rean){s.estado='En el área de bioinformática';aviso('bio','Llegó un reanálisis a En el área de bioinformática.',s.id)}ctx.cupOk=null;ctx.f.cupAp='';ctx.f.modo='';toast('Pago confirmado');render()},
 reaut(){const s=Object.values(S.st).find(x=>x.pid===S.me);const n=ctx.f.pdfname||'demanda.pdf';if(!/\.pdf$/i.test(n)){toast('El archivo debe ser PDF');return}s.cob.reaut=n;s.cob.aut='pendiente';aviso('adm','El paciente '+full(S.pat[s.pid])+' subió una demanda para reautorizar el estudio.',s.id);toast('Solicitud enviada al administrativo');render()},

 chat(){const q=(ctx.f.chat||'').trim();if(!q)return;chatAsk(q)},chatQ(q){chatAsk(q)},
 abrirAviso(i){const a=S.avisos[key()][+i];a.leido=true;if(a.sid){ctx.sid=a.sid;if(role==='paciente'){view='mi_estudio'}else if(['adm','medico'].includes(role)){view='det'}else if(role==='bio'){view='tareas'}else view=ROLES[role].nav[0][0]}render()},
 emitir(id){const s=S.st[id];s.pres={monto:price(s.genes.length),emitido:true};aviso('p:'+s.pid,'Ya está disponible el presupuesto de tu estudio.',id);toast('Presupuesto emitido y publicado para el paciente');ctx.sid=null;render()},
 regAut(id){const s=S.st[id];const r=ctx.f.arta||'Autorizado';if(r==='Rechazado'){if(!ctx.f.motivo){toast('Cargá el motivo del rechazo');return}s.cob.aut='Rechazado';s.cob.motivo=ctx.f.motivo;delete s.cob.reaut;aviso('p:'+s.pid,'La obra social rechazó el estudio.',id)}else{s.cob.aut='Autorizado';delete s.cob.reaut;aviso('p:'+s.pid,'Tu estudio fue autorizado. Ya podés sacar turno.',id);if(s.rean){s.estado='En el área de bioinformática';aviso('bio','Llegó un reanálisis a En el área de bioinformática.',id)}}toast('Respuesta registrada');ctx.sid=null;ctx.f.motivo='';render()},
 remuestreo(id){const s=S.st[id];const l=S.lotes.find(x=>x.id===s.lote);if(l)l.est=l.est.filter(x=>x!==id);s.hist.push({t:'Hoy',x:'Remuestreo solicitado ('+(ctx.f.rmot||'Volumen insuficiente')+')'+(s.turno?'. Turno anterior: '+s.turno.fecha+' '+s.turno.hora+', '+LAB(s.turno.lab).n:'')+(s.ml!=null?'. Muestra de '+s.ml+' ml':'')+'. Sin costo para el paciente.'});s.lote=null;s.turno=null;s.estado='Creado';s.ml=null;aviso('p:'+s.pid,'Necesitamos una nueva muestra ('+(ctx.f.rmot||'Volumen insuficiente')+'). No tiene costo. Sacá un nuevo turno.',id);aviso('medico','Se solicitó un remuestreo para '+full(S.pat[s.pid])+'.',id);toast('Remuestreo solicitado. Se avisó al médico y al paciente');render()},
 programar(id){const l=S.lotes.find(x=>x.id===id);l.estado='Retiro programado';l.retiro=(ctx.f.fdia||'Vie 09/10')+' a las '+(ctx.f.fhora||'09:00');toast('Retiro programado con FedEx');render()},
 reintentarPermiso(id){const l=S.lotes.find(x=>x.id===id);if(S.ministerioDown){toast('La API del Ministerio sigue sin responder');return}l.estado='Con permiso';l.permiso=true;toast('Permiso recibido');render()},
 cargarCrudos(id){const n=(ctx.f.crudoname||'').trim();if(!n){toast('El archivo está vacío: la carga se rechaza');return}if(!/\.txt$/i.test(n)){toast('Formato inválido: el archivo debe ser de texto (.txt)');return}const s=S.st[id];s.crudos=true;s.estado='En el área de bioinformática';s.lote=null;aviso('bio','Llegó un estudio nuevo a En el área de bioinformática ('+full(S.pat[s.pid])+').',id);toast('Datos crudos cargados. Se avisó a los bioinformáticos');ctx.sid=null;render()},
 recoger(lab){Object.values(S.st).filter(s=>s.estado==='Listo para retirar'&&s.turno.lab===lab).forEach(s=>s.estado='En camino al laboratorio central');S.picked.push(lab);render()},
 llegue(){const L=Object.values(S.st).filter(s=>s.estado==='En camino al laboratorio central');L.forEach(s=>{s.estado='En laboratorio central';sumarALote(s)});S.picked=[];toast('Muestras entregadas. El sistema las incorporó al lote');render()},
 tomar(id){const s=S.st[id];s.estado='En análisis por un bioinformático';ctx.sid=id;ctx.mine=true;ctx.reg={};toast('Estudio tomado');render()},
 finalizar(id){const s=S.st[id],rg=ctx.reg||{};const v=[];s.genes.forEach(g=>{const r=rg[g];if(r&&r.i!=='none')v.push({g,v:r.v,c:r.c})});if(s.genes.some(g=>!rg[g])){toast('Registrá una variante, o Sin variantes, en cada gen');return}s.variantes=v.length?v:[{g:s.genes[0],v:'Sin variantes',c:'—'}];s.estado='Resultado disponible';aviso('medico','El resultado del estudio de '+full(S.pat[s.pid])+' está disponible.',id);aviso('p:'+s.pid,'Tu resultado ya está disponible en la plataforma.',id);ctx.mine=false;ctx.reg={};toast('Análisis finalizado. Resultado en PDF generado');view='tareas';render()},
 reanalisis(id){ctx.rean=id;render()},
 confirmarRean(id){const s=S.st[id];const k=ctx.f.rdx;const nuevos=S.patol[k].gen.filter(g=>!s.genes.includes(g));s.genes=[...s.genes,...nuevos];s.estado='Creado';s.pres=null;s.cob=null;s.pagado=false;s.rean=true;s.turno=null;s.hist.push({t:'Hoy',x:'Reanálisis solicitado con el nuevo diagnóstico presuntivo: '+S.patol[k].n+'. Se reutilizan los datos crudos, sin nueva extracción.'});aviso('adm','Reanálisis solicitado para '+full(S.pat[s.pid])+': hay que emitir un nuevo presupuesto.',id);ctx.rean=null;ctx.f.rdx='';toast('Reanálisis solicitado. El administrativo emitirá el presupuesto');view='estudios';render()},

 simFedex(){const id=$('#simLote').value,l=S.lotes.find(x=>x.id===id);l.estado='En viaje a Corea';l.est.forEach(e=>S.st[e].estado='En viaje a Corea');toast('FedEx retiró el lote: estudios En viaje a Corea');render()}
};
function openDr(mode){if(mode===null||(drawerOpen&&drawerMode===mode)){drawerOpen=false;$('#drawer').innerHTML=''}else{drawerOpen=true;drawerMode=mode;renderDrawer()}document.body.classList.toggle('dr',drawerOpen)}
function chatAsk(q){S.chat.push({x:q});const t=q.toLowerCase();let r='Puedo responder dudas generales sobre las patologías lisosomales. Para consultas médicas personales, hablá con tu médico tratante.';
 if(t.includes('fabry'))r='La enfermedad de Fabry es una patología lisosomal por déficit de la enzima alfa-galactosidasa A (gen GLA). Puede dar dolor en manos y pies, lesiones en la piel y compromiso del corazón y del riñón.';
 else if(t.includes('lisosomal'))r='Las patologías lisosomales son enfermedades genéticas en las que falta una enzima que los lisosomas necesitan para degradar sustancias. Por eso se acumulan y afectan distintos órganos.';
 else if(t.includes('exoma'))r='El estudio de exoma lee las regiones del ADN que codifican proteínas. Se hace con una muestra de sangre y analiza los genes asociados a la sospecha diagnóstica.';
 S.chat.push({b:true,x:r});ctx.f.chat='';render();const b=$('#chatbox');if(b)b.scrollTop=b.scrollHeight}
/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
  const lab=e.target.closest('[data-lab]');if(lab&&lab.dataset.lab&&view==='turno'){A.pickLab(lab.dataset.lab);return}
  const b=e.target.closest('[data-a]');if(!b||b.tagName==='SELECT'||b.tagName==='INPUT'&&b.type==='checkbox')return;const fn=A[b.dataset.a];if(fn)fn(b.dataset.p)});
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(e.key==='Escape'&&drawerOpen){openDr(null);return}
  if((e.key==='Enter'||e.key===' ')&&t.matches&&t.matches('tr.click')){e.preventDefault();t.click();return}
  if(e.key==='Enter'&&t.dataset&&t.dataset.sn){const u=$('#u_'+t.dataset.sn);const li=u&&!u.hidden&&u.querySelector('[data-pick]');if(li){e.preventDefault();li.dispatchEvent(new MouseEvent('mousedown',{bubbles:true}))}}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.f){if(t.type==='radio'){if(t.checked)ctx.f[t.dataset.f]=t.value}else ctx.f[t.dataset.f]=t.value}
  if(t.dataset.sn){const n=t.dataset.sn,v=t.value.trim().toLowerCase(),u=$('#u_'+n);if(v.length<3){u.hidden=true;return}
    const h=SNOMED.filter(x=>x.toLowerCase().includes(v));u.innerHTML=h.length?h.map(x=>'<li data-pick="'+n+'|'+x+'">'+x+'</li>').join(''):'<li class="muted" style="cursor:default">Sin resultados. No se admite texto libre.</li>';u.hidden=false}
});
document.addEventListener('mousedown',e=>{const li=e.target.closest('[data-pick]');if(!li)return;e.preventDefault();const [n,x]=li.dataset.pick.split('|');
  if(n==='pcardin'){ctx.f.pcard=x}else{const arr=ctx.f[n]=ctx.f[n]||[];if(!arr.includes(x))arr.push(x)}render()});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.f&&t.dataset.rr)render();
  if(t.dataset.f&&t.tagName==='SELECT'&&!t.dataset.rr)ctx.f[t.dataset.f]=t.value;
  if(t.dataset.chk){const s=ctx.sel=ctx.sel||[];if(t.checked)s.push(t.dataset.chk);else ctx.sel=s.filter(x=>x!==t.dataset.chk)}
  if(t.dataset.chk2){ctx.f[t.dataset.chk2]=t.checked;render()}
  if(t.dataset.reg){const g=t.dataset.reg;ctx.reg=ctx.reg||{};if(t.value==='')delete ctx.reg[g];else if(t.value==='none')ctx.reg[g]={i:'none'};else{const v=VARIANTES[g][+t.value];ctx.reg[g]={i:t.value,v:v[0],c:v[1]}}render()}
  if(t.dataset.aChange==='addEsp'){if(t.value){(ctx.f.resp=ctx.f.resp||[]).push(t.value);render()}}
  if(t.dataset.aChange==='minDown'){S.ministerioDown=t.checked}
});
$('#roleSel').addEventListener('change',e=>{role=e.target.value;view=ROLES[role].nav[0][0];ctx.cancel=false;ctx.sid=null;render()});
$('#personaSel').addEventListener('change',e=>{S.me=e.target.value;ctx.f.modo='';render()});
window.__proto={go:(r,v,c)=>{role=r;view=v;if(c)Object.assign(ctx,c);render()},ctx:()=>ctx,S:()=>S,A,render,setf:o=>Object.assign(ctx.f,o)};
render();
